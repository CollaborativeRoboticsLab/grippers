/**:
  ros__parameters:
    # Transport
    device_name: /dev/ttyUSB0
    baudrate: 1000000
    servo_id: 1

    position_is_radians: false
    ticks_per_rev: 4096
    direction: 1
    zero_offset_ticks: 0

    open_position: 0.0
    close_position: 2048.0

    # Motion behavior
    speed: 4095
    goal_tolerance_ticks: 20
    motion_timeout_sec: 3.0
    poll_rate_hz: 30.0
    status_publish_rate_hz: 1.0

    # Torque limiting (Feetech-style "torque mode" implemented as a torque limit)
    use_torque_mode: false
    # Conservative starter calibration:
    # - The vendored driver reports present current in amps.
    # - With torque_per_current_unit=1.0, the action 'torque' units are initially amps
    #   until you calibrate them to physical torque units such as Nm.
    torque_per_current_unit: 1.0
    torque_limit_per_torque_unit: 50.0
    control_torque: 0.5
    safety_torque_limit: 1.0
    default_torque_limit: 0.0
    torque_limit_register: 48  # 0x30 TORQUE_LIMIT

    close_default: true
