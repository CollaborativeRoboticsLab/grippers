
/**:
  ros__parameters:
    # Select which model preset to load from gripper_servo_dynamixel/share/gripper_servo_dynamixel/config/<model>.yaml
    # Valid examples: XM430-W350
    motor_model: XM430-W350

    XM430-W350:
      device_name: /dev/ttyUSB0
      baudrate: 57600
      servo_id: 1

      position_is_radians: false
      ticks_per_rev: 4096
      gear_ratio: 1.0
      direction: 1
      zero_offset_ticks: 0

      open_position: 900.0
      close_position: 1950.0

      goal_tolerance_ticks: 20
      motion_timeout_sec: 3.0
      poll_rate_hz: 30.0
      status_publish_rate_hz: 1.0

      # Current Limit(38) and Goal Current(102) use raw current units.
      # For XM430-W350 the e-Manual documents about 2.69 mA per count and a
      # default Current Limit range of 0..1193.
      min_current_unit: 0
      max_current_unit: 1193

      use_torque_mode: false
      control_torque: 0.0
      safety_torque_limit: 3.5
      stall_torque: 4.1
      stall_current: 2.3
      close_default: true
      torque_per_current_unit: 0.00480

      comm_retry_timeout_sec: 2.0
      comm_retry_initial_delay_sec: 0.05
      comm_retry_max_delay_sec: 0.5
      comm_retry_backoff: 1.7
      comm_retry_reinit_every: 5

      addr_operating_mode: 11
      addr_torque_enable: 64
      addr_goal_current: 102
      addr_goal_position: 116
      addr_present_current: 126
      addr_present_position: 132

      operating_mode_current: 0
      operating_mode_position: 3
      operating_mode_current_based_position: 5