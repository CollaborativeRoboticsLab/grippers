gripper_two_fingers_node:
  ros__parameters:
    # Gripper-level selection: choose the motor preset and override the site-specific values
    # for this concrete gripper instance.
    motor_model: XM430

    # Publish the two slider joints needed by robot_state_publisher.
    # The updated URDF now keeps each support subtree directly attached below the slider child,
    # so no extra support-connectivity TF bridge is required.
    publish_gripper_joint_states: true
    publish_support_connectivity_tf: false
    gripper_joint_state_topic: joint_states
    gripper_frame_prefix: ''
    gripper_joint_name_prefix: ''
    gripper_joint_state_rate_hz: 10.0

    # Preferred gripper-level articulation model:
    # - One coupled displacement joint per finger side.
    # - These map directly to the updated slider joints in the URDF.
    gripper_left_finger:
      joint_name: gripper_planar_4
      multiplier: 0.0
      offset: 0.0
      joint_open_position: -0.045
      joint_close_position: 0.0
      support_parent_frame: gripper_mgnr09r315hm
      support_child_frame: gripper_gripper_support_1
      support_origin_xyz: [0.129112, -0.00361501, -0.0045]
      support_axis_xyz: [-1.0, 0.0, 0.0]

    gripper_right_finger:
      joint_name: gripper_planar_5
      multiplier: 0.0
      offset: 0.0
      joint_open_position: -0.045
      joint_close_position: 0.0
      support_parent_frame: gripper_mgnr09r315hm_1
      support_child_frame: gripper_gripper_support
      support_origin_xyz: [0.0189804, -0.0025, 0.0045]
      support_axis_xyz: [1.0, 0.0, 0.0]

    # The support_* values are retained for compatibility but are unused while
    # publish_support_connectivity_tf remains false.

    XM430:
      device_name: /dev/ttyUSB0
      baudrate: 57600
      dxl_id: 1

      position_is_radians: false
      open_position: 900.0
      close_position: 1950.0

      use_torque_mode: false
      default_torque: 0.0
      close_default: true