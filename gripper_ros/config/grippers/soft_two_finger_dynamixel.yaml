gripper_two_fingers_node:
  ros__parameters:
    # Gripper-level selection: choose the motor preset and override the site-specific values
    # for this concrete gripper instance.
    motor_model: XM430-W350

    # Publish the two slider joints needed by robot_state_publisher.
    publish_gripper_joint_states: true
    gripper_joint_state_topic: joint_states
    gripper_joint_name_prefix: ''
    gripper_joint_state_rate_hz: 10.0
    gripper_open_width: 0.09
    gripper_closed_width: 0.0

    # Preferred gripper-level articulation model:
    # - One slider joint per finger side.
    # - These map directly to the updated slider joints in the URDF.
    gripper_left_finger:
      joint_name: gripper_planar_4
      joint_open_position: -0.045
      joint_close_position: 0.0

    gripper_right_finger:
      joint_name: gripper_planar_5
      joint_open_position: -0.045
      joint_close_position: 0.0

    # Default force exerted by the gripper in newtons when torque mode is enabled
    # and the action goal leaves command.max_effort at 0.0.
    max_effort: 0.0

    # Converts gripper force in newtons to the low-level servo torque units.
    # Start with an external calibration and refine it as better sensing becomes available.
    max_effort_to_torque_factor: 1.0

    # Calibration/debugging escape hatch: when true, gripper-level command.max_effort
    # bypasses max_effort_to_torque_factor and is treated directly as low-level torque.
    bypass_max_effort: false

    XM430-W350:
      device_name: /dev/ttyUSB0
      baudrate: 57600
      servo_id: 1

      position_is_radians: false
      open_position: 900.0
      close_position: 1950.0

      min_current_unit: 0
      max_current_unit: 1193

      # Default low-level torque request for the servo action interface.
      control_torque: 2.0
      use_torque_mode: true
      safety_torque_limit: 2.0
      close_default: true